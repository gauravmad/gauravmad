name: Update profile cards

# Contribution snake, committed into profile/ so the README never depends on a public widget server.

on:
  schedule:
    - cron: "30 0 * * *" # daily, 06:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-cards.yml"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?color_snake=#EA580C&color_dots=#EBEDF0,#FED7AA,#FDBA74,#FB923C,#EA580C
            profile/snake-dark.svg?palette=github-dark&color_snake=#F97316&color_dots=#161B22,#431407,#9A3412,#EA580C,#FBBF24

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update profile cards" || exit 0
          git push
